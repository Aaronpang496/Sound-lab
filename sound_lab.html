<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Lab Pro - ANC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

  * { box-sizing: border-box; user-select: none; }
  
  body {
    background-color: #050505;
    color: #fff;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 50% 0%, #1a1a2e 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
  }

  .dashboard {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .panel {
    background: rgba(15, 15, 20, 0.85);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    opacity: 0.5;
  }

  h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
    box-shadow: 0 0 10px transparent;
    transition: 0.3s;
  }
  .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  .status-dot.recording { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  .control-group { margin-bottom: 20px; }
  
  label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #94a3b8; margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  select {
    width: 100%;
    padding: 12px;
    background: #111;
    color: #38bdf8;
    border: 1px solid #333;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    cursor: pointer;
    appearance: none;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    width: 100%; height: 6px;
    background: #222; border-radius: 3px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 18px; width: 18px;
    border-radius: 50%;
    background: #fff;
    margin-top: -6px;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 16px;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }

  #btn-play { background: #38bdf8; color: #000; }
  #btn-play.playing { background: #ef4444; color: #fff; }

  #btn-mic { background: #6366f1; color: #fff; }
  #btn-mic.active { background: #ef4444; }

  /* NEW ANC BUTTON */
  #btn-anc { 
    background: #333; 
    color: #fff; 
    margin-top: 15px; 
    border: 1px solid #555;
  }
  #btn-anc.active { 
    background: #facc15; 
    color: #000; 
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.5); 
  }

  .screen {
    width: 100%;
    height: 180px;
    background: #000;
    border-radius: 8px;
    border: 1px solid #222;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
  }
  
  .screen-label {
    position: absolute; top: 10px; left: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #444;
    z-index: 10;
  }

  @media (max-width: 768px) {
    .dashboard { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="dashboard">
  
  <!-- GENERATOR PANEL -->
  <div class="panel">
    <h2><div class="status-dot" id="gen-dot"></div> Generator</h2>
    <div class="control-group">
      <label>Waveform</label>
      <select id="waveform">
        <option value="sine">SINE</option>
        <option value="square">SQUARE</option>
        <option value="sawtooth">SAWTOOTH</option>
        <option value="triangle">TRIANGLE</option>
      </select>
    </div>
    <div class="control-group">
      <label>Frequency <span id="freq-val">440 Hz</span></label>
      <input type="range" id="frequency" min="100" max="2000" value="440">
    </div>
    <div class="screen" style="margin-bottom: 20px;">
      <div class="screen-label">REAL-TIME OUTPUT</div>
      <canvas id="preview-canvas"></canvas>
    </div>
    <button id="btn-play">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 
      Play Signal
    </button>
  </div>

  <!-- ANC / DETECTOR PANEL -->
  <div class="panel">
    <h2><div class="status-dot" id="mic-dot"></div> ANC & Live Detector</h2>
    <div class="screen" style="margin-bottom: 20px;">
      <div class="screen-label">MIC OSCILLOSCOPE</div>
      <canvas id="mic-canvas"></canvas>
    </div>
    
    <button id="btn-mic">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      Start Microphone
    </button>

    <button id="btn-anc" disabled style="opacity: 0.5;">
      Enable Noise Cancelling
    </button>
  </div>

</div>

<script>
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();
  
  // --- 1. GENERATOR SETUP ---
  const btnPlay = document.getElementById('btn-play');
  const genDot = document.getElementById('gen-dot');
  const waveformSelect = document.getElementById('waveform');
  const freqSlider = document.getElementById('frequency');
  const freqVal = document.getElementById('freq-val');
  const previewCanvas = document.getElementById('preview-canvas');
  const previewCtx = previewCanvas.getContext('2d');

  let osc = null;
  let genAnalyser = null;
  let genDataArray = null;
  let isPlaying = false;
  let genAnimationId = null;

  freqSlider.oninput = () => {
    freqVal.textContent = freqSlider.value + " Hz";
    if (osc) osc.frequency.setValueAtTime(freqSlider.value, audioCtx.currentTime);
  };

  btnPlay.onclick = () => {
    if (isPlaying) {
      osc.stop(); osc.disconnect(); genAnalyser.disconnect();
      osc = null; genAnalyser = null;
      btnPlay.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play Signal`;
      btnPlay.classList.remove('playing'); genDot.classList.remove('active');
      isPlaying = false; cancelAnimationFrame(genAnimationId);
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    } else {
      osc = audioCtx.createOscillator();
      osc.type = waveformSelect.value;
      osc.frequency.setValueAtTime(freqSlider.value, audioCtx.currentTime);
      
      genAnalyser = audioCtx.createAnalyser();
      genAnalyser.fftSize = 2048;
      
      osc.connect(genAnalyser);
      genAnalyser.connect(audioCtx.destination);
      osc.start();
      
      genDataArray = new Uint8Array(genAnalyser.frequencyBinCount);
      btnPlay.innerHTML = `STOP SIGNAL`;
      btnPlay.classList.add('playing'); genDot.classList.add('active');
      isPlaying = true;
      drawGen();
    }
  };

  function drawGen() {
    if (!isPlaying) return;
    genAnimationId = requestAnimationFrame(drawGen);
    const width = previewCanvas.width = previewCanvas.clientWidth;
    const height = previewCanvas.height = previewCanvas.clientHeight;
    genAnalyser.getByteTimeDomainData(genDataArray);
    
    previewCtx.fillStyle = '#000';
    previewCtx.fillRect(0, 0, width, height);
    previewCtx.lineWidth = 2; previewCtx.strokeStyle = '#38bdf8'; 
    previewCtx.beginPath();
    
    const sliceWidth = width * 1.0 / genDataArray.length;
    let x = 0;
    
    for (let i = 0; i < genDataArray.length; i++) {
      const v = genDataArray[i] / 128.0;
      const y = v * height / 2;
      if (i === 0) previewCtx.moveTo(x, y);
      else previewCtx.lineTo(x, y);
      x += sliceWidth;
    }
    previewCtx.lineTo(width, height / 2);
    previewCtx.stroke();
  }

  // --- 2. MIC & ANC SETUP ---
  const btnMic = document.getElementById('btn-mic');
  const btnAnc = document.getElementById('btn-anc');
  const micDot = document.getElementById('mic-dot');
  const micCanvas = document.getElementById('mic-canvas');
  const micCtx = micCanvas.getContext('2d');
  
  let analyser = null;
  let dataArray = null;
  let isMicOn = false;
  let micAnimationId = null;

  let micStream = null;
  let micSource = null;
  let ancGain = null;
  let isAncOn = false;

  btnMic.onclick = async () => {
    if (isMicOn) {
      isMicOn = false;
      btnMic.textContent = "START MICROPHONE";
      btnMic.classList.remove('active');
      micDot.classList.remove('recording');
      cancelAnimationFrame(micAnimationId);
      micCtx.clearRect(0, 0, micCanvas.width, micCanvas.height);
      
      // Turn off ANC if it was on
      if (isAncOn) toggleAnc();
      
      // Stop microphone
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      btnAnc.disabled = true;
      btnAnc.style.opacity = "0.5";
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micSource = audioCtx.createMediaStreamSource(micStream);
      
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      micSource.connect(analyser);
      
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      isMicOn = true;
      
      btnMic.textContent = "STOP MICROPHONE";
      btnMic.classList.add('active');
      micDot.classList.add('recording');
      
      // Enable the ANC button
      btnAnc.disabled = false;
      btnAnc.style.opacity = "1";
      
      drawMic();
    } catch (err) {
      alert("Microphone access denied.");
    }
  };

  // --- THE NOISE CANCELLING MAGIC ---
  function toggleAnc() {
    if (!isMicOn) return;
    
    if (isAncOn) {
      // Turn it off
      micSource.disconnect(ancGain);
      ancGain.disconnect(audioCtx.destination);
      ancGain = null;
      isAncOn = false;
      btnAnc.textContent = "Enable Noise Cancelling";
      btnAnc.classList.remove('active');
    } else {
      // Turn it on
      ancGain = audioCtx.createGain();
      ancGain.gain.value = -1; // INVERT THE PHASE (Negative 1)
      
      // Connect mic -> invert -> speakers
      micSource.connect(ancGain);
      ancGain.connect(audioCtx.destination);
      
      isAncOn = true;
      btnAnc.textContent = "CANCELING NOISE (ACTIVE)";
      btnAnc.classList.add('active');
    }
  }

  btnAnc.onclick = toggleAnc;

  function drawMic() {
    if (!isMicOn) return;
    micAnimationId = requestAnimationFrame(drawMic);
    
    const width = micCanvas.width = micCanvas.clientWidth;
    const height = micCanvas.height = micCanvas.clientHeight;
    analyser.getByteTimeDomainData(dataArray);
    
    micCtx.fillStyle = '#000';
    micCtx.fillRect(0, 0, width, height);
    
    micCtx.lineWidth = 2; micCtx.strokeStyle = '#22c55e'; 
    micCtx.beginPath();
    
    const sliceWidth = width * 1.0 / dataArray.length;
    let x = 0;
    
    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * height / 2;
      if (i === 0) micCtx.moveTo(x, y);
      else micCtx.lineTo(x, y);
      x += sliceWidth;
    }
    micCtx.lineTo(width, height / 2);
    micCtx.stroke();
  }
</script>
</body>
</html>
