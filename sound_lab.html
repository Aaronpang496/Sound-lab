<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Lab Pro - Synth Piano</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #050505;
    color: #fff;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 50% 0%, #1a1a2e 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
  }

  .dashboard {
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel {
    background: rgba(15, 15, 20, 0.85);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    opacity: 0.5;
  }

  h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 10px #22c55e;
  }

  .controls { display: flex; gap: 20px; margin-bottom: 20px; }
  .control-group { flex: 1; }
  
  label {
    display: block; font-size: 12px; color: #94a3b8; margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  select {
    width: 100%; padding: 12px; background: #111; color: #38bdf8;
    border: 1px solid #333; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    outline: none; cursor: pointer;
  }

  .screen {
    width: 100%;
    height: 150px;
    background: #000;
    border-radius: 8px;
    border: 1px solid #222;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
    margin-bottom: 20px;
  }
  
  .screen-label {
    position: absolute; top: 10px; left: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #444;
  }

  /* --- PIANO STYLES --- */
  .piano-container {
    display: flex;
    justify-content: center;
    position: relative;
    height: 200px;
    background: #1a1a1a;
    padding: 10px;
    border-radius: 10px;
    box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
  }

  .key {
    position: relative;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  .key.white {
    width: 60px;
    height: 100%;
    background: linear-gradient(to bottom, #eee, #fff);
    border: 1px solid #999;
    color: #333;
    z-index: 1;
  }

  .key.white:active, .key.white.active {
    background: #38bdf8;
    color: white;
    transform: scaleY(0.98);
    box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
  }

  .key.black {
    width: 40px;
    height: 60%;
    background: linear-gradient(to bottom, #111, #333);
    border: 1px solid #000;
    color: #aaa;
    position: absolute;
    z-index: 2;
    margin-left: -20px; /* Centers it between white keys */
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }

  .key.black:active, .key.black.active {
    background: #0284c7;
    color: white;
    transform: scaleY(0.95);
  }
</style>
</head>
<body>

<div class="dashboard">
  
  <!-- SYNTH PIANO PANEL -->
  <div class="panel">
    <h2><div class="status-dot"></div> Synthesizer Piano</h2>
    
    <div class="controls">
      <div class="control-group">
        <label>Waveform</label>
        <select id="waveform">
          <option value="sine">SINE (Pure)</option>
          <option value="square">SQUARE (8-Bit)</option>
          <option value="sawtooth">SAWTOOTH (Brass)</option>
          <option value="triangle">TRIANGLE (Flute)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Volume</label>
        <input type="range" id="volume" min="0" max="100" value="50" style="width:100%;">
      </div>
    </div>

    <div class="screen">
      <div class="screen-label">LIVE WAVEFORM</div>
      <canvas id="preview-canvas"></canvas>
    </div>

    <!-- 15-Key Piano (C4 to C6) -->
    <div class="piano-container" id="piano">
      <!-- White Keys -->
      <div class="key white" data-freq="261.63">C4</div>
      <div class="key white" data-freq="293.66">D4</div>
      <div class="key white" data-freq="329.63">E4</div>
      <div class="key white" data-freq="349.23">F4</div>
      <div class="key white" data-freq="392.00">G4</div>
      <div class="key white" data-freq="440.00">A4</div>
      <div class="key white" data-freq="493.88">B4</div>
      <div class="key white" data-freq="523.25">C5</div>
      <div class="key white" data-freq="587.33">D5</div>
      <div class="key white" data-freq="659.25">E5</div>
      <div class="key white" data-freq="698.46">F5</div>
      <div class="key white" data-freq="783.99">G5</div>
      <div class="key white" data-freq="880.00">A5</div>
      <div class="key white" data-freq="987.77">B5</div>
      <div class="key white" data-freq="1046.50">C6</div>
      
      <!-- Black Keys (Positioned absolute) -->
      <!-- We use CSS margins to overlap them -->
      <div class="key black" style="left: 45px;" data-freq="277.18">C#4</div>
      <div class="key black" style="left: 105px;" data-freq="311.13">D#4</div>
      
      <div class="key black" style="left: 225px;" data-freq="369.99">F#4</div>
      <div class="key black" style="left: 285px;" data-freq="415.30">G#4</div>
      <div class="key black" style="left: 345px;" data-freq="466.16">A#4</div>

      <div class="key black" style="left: 465px;" data-freq="554.37">C#5</div>
      <div class="key black" style="left: 525px;" data-freq="622.25">D#5</div>

      <div class="key black" style="left: 645px;" data-freq="739.99">F#5</div>
      <div class="key black" style="left: 705px;" data-freq="830.61">G#5</div>
      <div class="key black" style="left: 765px;" data-freq="932.33">A#5</div>
    </div>
  </div>
</div>

<script>
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();
  
  const waveformSelect = document.getElementById('waveform');
  const volumeSlider = document.getElementById('volume');
  const previewCanvas = document.getElementById('preview-canvas');
  const previewCtx = previewCanvas.getContext('2d');

  let osc = null;
  let genAnalyser = null;
  let genDataArray = null;
  let isPlaying = false;
  let genAnimationId = null;

  // Main volume control
  let masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5; // Default 50%
  masterGain.connect(audioCtx.destination);

  volumeSlider.oninput = () => {
    masterGain.gain.value = volumeSlider.value / 100;
  };

  // --- PIANO LOGIC ---
  function playNote(freq) {
    // If a note is already playing, stop it
    if (osc) {
      osc.stop();
      osc.disconnect();
      cancelAnimationFrame(genAnimationId);
    }

    // Create new oscillator
    osc = audioCtx.createOscillator();
    osc.type = waveformSelect.value;
    osc.frequency.value = freq;

    // Create analyser for the visualizer
    genAnalyser = audioCtx.createAnalyser();
    genAnalyser.fftSize = 2048;
    
    osc.connect(genAnalyser);
    genAnalyser.connect(masterGain); // Connect to master volume
    
    osc.start();
    genDataArray = new Uint8Array(genAnalyser.frequencyBinCount);
    isPlaying = true;
    
    drawGen();
  }

  function stopNote() {
    if (osc) {
      osc.stop();
      osc.disconnect();
      osc = null;
      isPlaying = false;
      cancelAnimationFrame(genAnimationId);
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    }
  }

  // Attach events to keys (Mouse & Touch)
  const keys = document.querySelectorAll('.key');
  keys.forEach(key => {
    const freq = parseFloat(key.getAttribute('data-freq'));
    
    // When pressed
    key.addEventListener('pointerdown', (e) => {
      e.preventDefault(); // Prevent scrolling on mobile
      key.classList.add('active');
      playNote(freq);
    });

    // When released
    key.addEventListener('pointerup', () => {
      key.classList.remove('active');
      stopNote();
    });
    
    key.addEventListener('pointerleave', () => {
      key.classList.remove('active');
      stopNote();
    });
  });

  // --- VISUALIZER ---
  function drawGen() {
    if (!isPlaying) return;
    genAnimationId = requestAnimationFrame(drawGen);
    
    const width = previewCanvas.width = previewCanvas.clientWidth;
    const height = previewCanvas.height = previewCanvas.clientHeight;

    genAnalyser.getByteTimeDomainData(genDataArray);
    
    previewCtx.fillStyle = '#000';
    previewCtx.fillRect(0, 0, width, height);
    
    previewCtx.lineWidth = 2;
    previewCtx.strokeStyle = '#38bdf8'; 
    previewCtx.beginPath();
    
    const sliceWidth = width * 1.0 / genDataArray.length;
    let x = 0;
    
    for (let i = 0; i < genDataArray.length; i++) {
      const v = genDataArray[i] / 128.0;
      const y = v * height / 2;
      
      if (i === 0) previewCtx.moveTo(x, y);
      else previewCtx.lineTo(x, y);
      
      x += sliceWidth;
    }
    
    previewCtx.lineTo(width, height / 2);
    previewCtx.stroke();
  }

  // Resume audio context on first click (Browser security requirement)
  document.body.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }, { once: true });

</script>
</body>
</html>
